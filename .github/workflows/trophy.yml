name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: harshi-112
          output: trophy.svg
          config_order: ASC
          config_theme: dracula
          config_no_background: true
          config_no_frame: true
          config_column: 6

      - name: Push Trophy SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: .
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
